<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380">
  <rect width="920" height="380" rx="24" fill="#f6f9ff" stroke="#d6e4f7" stroke-width="2"/>
  <text x="36" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#17325c">Perbandingan Scratch vs Blockly &amp; Modularisasi Program (Halaman 42–48)</text>
  <text x="36" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#526a8c">Keduanya menggunakan blok visual, namun Blockly mampu mengonversi blok ke kode teks berbagai bahasa.</text>

  <g transform="translate(36,90)">
    <rect x="0" y="0" width="268" height="258" rx="16" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <rect x="18" y="16" width="120" height="26" rx="13" fill="#fef3c7"/>
    <text x="78" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#b45309">1. SCRATCH</text>
    <text x="18" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Fokus cerita, animasi &amp; gim</text>
    <text x="18" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Memiliki Sprite &amp; Kostum</text>
    <text x="18" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Panggung (Stage) &amp; Backdrop</text>
    <text x="18" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Event Handling interaktif</text>
    <rect x="18" y="166" width="232" height="72" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="134" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#92400e">Blok Berwarna Sesuai Fungsi</text>
    <text x="134" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b45309">Gerakan • Tampilan • Suara • Sensor</text>

    <rect x="290" y="0" width="268" height="258" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="308" y="16" width="170" height="26" rx="13" fill="#dbeafe"/>
    <text x="393" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">2. BLOCKLY (GOOGLE)</text>
    <text x="308" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Pustaka open-source berbasis blok</text>
    <text x="308" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Validasi logika sambungan puzzle</text>
    <text x="308" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b">• Konversi langsung ke kode teks:</text>
    <text x="322" y="140" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">JS, Python, PHP, Lua, Dart</text>
    <rect x="308" y="166" width="232" height="72" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="424" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af">5 Kategori Blok Utama</text>
    <text x="424" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8">Kontrol • Logika • Math • Teks • Fungsi</text>

    <rect x="580" y="0" width="268" height="258" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="598" y="16" width="186" height="26" rx="13" fill="#d1fae5"/>
    <text x="691" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#047857">3. MODULARISASI PROGRAM</text>
    <text x="598" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">• Modul:</text>
    <text x="610" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Bagian terpisah berisi fungsi/variabel</text>
    <text x="598" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">• Fungsi (Function):</text>
    <text x="610" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Mengembalikan nilai (return value)</text>
    <text x="598" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065f46">• Prosedur (Procedure):</text>
    <text x="610" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Menjalankan aksi tanpa return value</text>
    <rect x="598" y="196" width="232" height="44" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="714" y="223" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#065f46">def hitung_luas(p, l): return p*l</text>
  </g>
</svg>