<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
  </defs>
  <rect width="920" height="420" rx="24" fill="url(#bg1)" stroke="#d6e4f7" stroke-width="2"/>
  <text x="36" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#17325c">Perbandingan Struktur Data Linier dan Nonlinier (Halaman 3–6)</text>
  <text x="36" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#526a8c">Struktur data linier menyusun elemen secara berurutan, sedangkan nonlinier membentuk percabangan/jejaring.</text>

  <!-- Panel Kiri: Linier -->
  <rect x="32" y="92" width="416" height="296" rx="18" fill="#ffffff" stroke="#cfe0f5" stroke-width="1.5"/>
  <rect x="52" y="110" width="170" height="28" rx="14" fill="#e6f0ff"/>
  <text x="137" y="129" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#1e5bb8">1. STRUKTUR DATA LINIER</text>

  <!-- Array -->
  <text x="52" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d3557">a. Array (Indeks dimulai dari 0, ukuran tetap)</text>
  <g transform="translate(52,172)">
    <rect x="0" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="28" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">2</text><text x="28" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[0]</text>
    <rect x="64" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="92" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">4</text><text x="92" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[1]</text>
    <rect x="128" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="156" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">10</text><text x="156" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[2]</text>
    <rect x="192" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="220" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">5</text><text x="220" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[3]</text>
    <rect x="256" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="284" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">15</text><text x="284" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[4]</text>
    <rect x="320" y="0" width="56" height="36" rx="8" fill="#eef6ff" stroke="#7aaef2"/><text x="348" y="23" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1b4d9b">3</text><text x="348" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">[5]</text>
  </g>

  <!-- Stack & Queue -->
  <text x="52" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d3557">b. Stack (LIFO: Push/Pop) &amp; Queue (FIFO: Antrean)</text>
  <g transform="translate(52,265)">
    <rect x="0" y="0" width="175" height="102" rx="12" fill="#f8f5ff" stroke="#cbb8f5"/>
    <text x="87" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#5b3cc4">STACK (LIFO)</text>
    <rect x="38" y="30" width="98" height="20" rx="5" fill="#7c5ce6"/><text x="87" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">TOP: Data 3</text>
    <rect x="38" y="53" width="98" height="20" rx="5" fill="#9b82f3"/><text x="87" y="67" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">Data 2</text>
    <rect x="38" y="76" width="98" height="20" rx="5" fill="#b9a6f8"/><text x="87" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fff">Data 1</text>

    <rect x="192" y="0" width="184" height="102" rx="12" fill="#edfcf5" stroke="#a6e3c5"/>
    <text x="284" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#147a4d">QUEUE (FIFO)</text>
    <text x="284" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f6f4a">Masuk (Rear) → Keluar (Front)</text>
    <rect x="208" y="54" width="44" height="32" rx="7" fill="#1fa96c"/><text x="230" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">3</text>
    <rect x="262" y="54" width="44" height="32" rx="7" fill="#188c58"/><text x="284" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">2</text>
    <rect x="316" y="54" width="44" height="32" rx="7" fill="#116e44"/><text x="338" y="75" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">1</text>
  </g>

  <!-- Panel Kanan: Nonlinier -->
  <rect x="472" y="92" width="416" height="296" rx="18" fill="#ffffff" stroke="#cfe0f5" stroke-width="1.5"/>
  <rect x="492" y="110" width="196" height="28" rx="14" fill="#fff3e2"/>
  <text x="590" y="129" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#c25e09">2. STRUKTUR DATA NONLINIER</text>

  <!-- Tree -->
  <text x="492" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d3557">a. Tree (Hierarki: Root, Parent, Child, Leaf)</text>
  <g transform="translate(500,174)">
    <line x1="90" y1="22" x2="40" y2="66" stroke="#64748b" stroke-width="2"/>
    <line x1="90" y1="22" x2="140" y2="66" stroke="#64748b" stroke-width="2"/>
    <line x1="40" y1="66" x2="18" y2="112" stroke="#64748b" stroke-width="2"/>
    <line x1="40" y1="66" x2="62" y2="112" stroke="#64748b" stroke-width="2"/>
    <circle cx="90" cy="22" r="18" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="90" y="27" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#9a3412">A</text>
    <text x="132" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#c2410c">← Root</text>
    <circle cx="40" cy="66" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="40" y="71" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#075985">B</text>
    <circle cx="140" cy="66" r="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="140" y="71" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#075985">C</text>
    <circle cx="18" cy="112" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="18" y="117" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">D</text>
    <circle cx="62" cy="112" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="62" y="117" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#166534">E</text>
    <text x="90" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Bertingkat (Level 0, 1, 2)</text>
  </g>

  <!-- Graph -->
  <text x="692" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d3557">b. Graph (Vertex &amp; Edge)</text>
  <g transform="translate(695,174)">
    <line x1="35" y1="26" x2="135" y2="26" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="35" y1="26" x2="35" y2="108" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="35" y1="108" x2="135" y2="108" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="135" y1="26" x2="135" y2="108" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="35" y1="26" x2="135" y2="108" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="35" cy="26" r="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="35" y="31" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#3730a3">V1</text>
    <circle cx="135" cy="26" r="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="135" y="31" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#3730a3">V2</text>
    <circle cx="35" cy="108" r="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="35" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#3730a3">V3</text>
    <circle cx="135" cy="108" r="17" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="135" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#3730a3">V4</text>
    <text x="85" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Bebas / Tanpa Induk-Anak</text>
  </g>
</svg>