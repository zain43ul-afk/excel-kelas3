<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="920" height="370">
  <rect width="920" height="370" rx="24" fill="#f7faff" stroke="#d6e4f7" stroke-width="2"/>
  <text x="36" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#17325c">Deteksi Kesalahan Parity Bit &amp; Pemrograman Lampu Ozobot (Halaman 51–55)</text>
  <text x="36" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#526a8c">Bit paritas mendeteksi kesalahan transmisi biner, sedangkan OzoBlockly memprogram urutan lampu LED robot Ozobot.</text>

  <g transform="translate(36,92)">
    <rect x="0" y="0" width="412" height="244" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="1.5"/>
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#1e40af">A. Penambahan Parity Bit (Halaman 51)</text>
    <rect x="20" y="46" width="372" height="84" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="34" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">1. Paritas Genap (Even Parity) — Total bit '1' harus GENAP</text>
    <text x="34" y="90" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">Data: 1101001 (jumlah '1' = 4, sudah genap) → Parity = 0</text>
    <text x="34" y="112" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#1e40af">Hasil akhir: 11010010 (tetap 4 bit '1')</text>

    <rect x="20" y="142" width="372" height="84" rx="10" fill="#fef3c7" stroke="#fde68a"/>
    <text x="34" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#b45309">2. Paritas Ganjil (Odd Parity) — Total bit '1' harus GANJIL</text>
    <text x="34" y="186" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">Data: 1010110 (jumlah '1' = 4, masih genap) → Parity = 1</text>
    <text x="34" y="208" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#92400e">Hasil akhir: 10101101 (menjadi 5 bit '1')</text>

    <rect x="436" y="0" width="412" height="244" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="1.5"/>
    <text x="456" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#047857">B. Pemrograman Lampu Ozobot (Halaman 53–55)</text>
    <text x="456" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#334155">Platform visual: ozoblockly.com (Level Beginner / Intermediate)</text>
    <rect x="456" y="72" width="372" height="32" rx="8" fill="#fee2e2"/><text x="470" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Langkah 1: Set Light Color → Merah + Wait 2 detik</text>
    <rect x="456" y="110" width="372" height="32" rx="8" fill="#dcfce7"/><text x="470" y="131" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#166534">Langkah 2: Set Light Color → Hijau + Wait 2 detik</text>
    <rect x="456" y="148" width="372" height="32" rx="8" fill="#dbeafe"/><text x="470" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e40af">Langkah 3: Set Light Color → Biru + Wait 2 detik</text>
    <rect x="456" y="186" width="372" height="40" rx="8" fill="#f1f5f9"/><text x="470" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Langkah 4: Matikan lampu &amp; unggah via fitur "Load Ozobot"</text>
  </g>
</svg>